# CI for redisocket.v2. Replaces the retired Drone pipeline (.drone.yml):
# vet + `go test -race` on every push to master, every PR and every tag.
# The suite is self-contained (miniredis / embedded NATS), so no services.
name: ci

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Keep in sync with the `toolchain` line in go.mod.
          go-version: '1.27.3'
      - run: go vet ./...
      - run: go test -race -count=1 ./...
